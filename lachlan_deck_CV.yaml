          - Deploy Docker images through Synology's Container Manager to self-host web apps on my NAS
      - name: Cloud Computing Project
        date:
        start_date:
        end_date:
        location: RMIT Team of 3 [GitHub](https://github.com/Lachlan-Deck/RMIT_music_library_cloud_project)
        summary: "**Stack:** EC2, S3, Fargate, Lambda, API Gateway, Terraform, Ansible, DNS."
        highlights:
          - Delivered the EC2 backend and the deployment pipeline for all 3 backends (EC2, ECS, Lambda). Ansible installed the software, bootstrapped an Nginx reverse proxy and issued an HTTPS cert with Certbot and Let's Encrypt
          - Pipeline syncs the static frontend to S3 with per-user bucket names, so the whole team could deploy at once with no conflicts. Received a High Distinction
      - name: IoT Project
        date:
        start_date:
        end_date:
        location: RMIT Team of 4 [GitHub](https://github.com/Lachlan-Deck/RMIT_IOT_project)
        summary: "**Stack:** Raspberry Pis, Python, Flask, Postgres, MQTT, Nix Flakes. Room booking system for study spaces, split across 3 applications."
        highlights:
          - Set up the team's testing, deployment and development environments with Nix flakes, reproducible locally and on a Pi
          - Built the booking flow end to end over MQTT (wrote the listeners) and the Postgres master database, using a trigger to manage booking updates across tables. Received a high grade
      - name: Final-Year Industry Project
        date:
        start_date:
        end_date:
        location: RMIT Team of 4
        summary: "Internal tool for the RMIT course QA team that scrapes changing web pages into structured Excel documents. **Stack:** EC2, S3, Bedrock, Docker."
        highlights:
          - Redesigned the scraping architecture using Playwright, cutting LLM input tokens by ~66%, with type-safe outputs (Pydantic, LangChain) and a separately testable pipeline
          - Added a two-pass approach with a smaller, cheaper model, reducing running costs. Built shareable Nix flake demo environments for the clients, who were very happy; we received a HD
      - name: "D&D Game Engine API"
        date:
        start_date:
        end_date:
        location: Personal project [GitHub](https://github.com/Lachlan-Deck/T_TTRPG)
        summary: "**Stack:** Elixir, Phoenix, React TS, GraphQL (Absinthe)."
        highlights:
          - Built dice endpoints in Elixir with both a React and a Phoenix LiveView frontend over one GraphQL API. Work in Git trunk with templated PRs, squash merged into main
          - Implementing an event-driven Entity Component System and a parser for Roll20's /roll syntax
    Culture Fit:
      - I want to learn as much as I can about software engineering, CI/CD and infrastructure. I ask good questions, respect the time others spend mentoring me, and enjoy learning how other people approach problems.
      - Since I was 17 I've played Dungeons & Dragons with adults in the industry, which taught me a lot about collaborating, navigating social challenges and apologising for mistakes.
