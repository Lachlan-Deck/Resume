cv:
  name: Lachlan Deck
  headline:
  location: Melbourne, Australia
  email: notmyemail@gmail.com
  photo:
  phone:
  website:
  social_networks:
    - network: LinkedIn
      username: lachlan-deck-653632253
    - network: GitHub
      username: Lachlan-Deck
    - network: GitHub
      username: lachlan-deckRMIT
  custom_connections:
  sections:
    summary:
      - "Recent graduate who genuinely enjoys software, and discussing technical subjects, whether to clients, students I mentor or teammates. I ask good questions, take mentorship seriously, and enjoy picking up other people's ways of working. Avid Dungeons & Dragons player since 17, which has taught me a lot about working through interpersonal challenges, maintaining professional relationships, apologising for mistakes, and personal growth."
    education:
      - institution: RMIT University
        area: Enterprise Software Development
        degree: Bachelor of Information Technology
        date:
        start_date: 2022
        end_date: 2026-07
        location: Melbourne
        summary:
        highlights:
    projects:
      - name: LLM Web-Scraping Pipeline for RMIT QA Team (Capstone Project)
        date:
        start_date:
        end_date:
        location: RMIT Team of 4
        summary: "Internal tool that scrapes unformatted, changing web pages into structured Excel documents. **Stack:** Python, AWS Bedrock, EC2, S3, Docker, Playwright."
        highlights:
          - "Redesigned the scraping architecture with Playwright so LLM calls needed minimal tokens (input tokens cut by ~66%), with type-safe outputs (Pydantic, LangChain) and a separately testable pipeline, delivered with a testing harness"
          - "Added a two-pass approach using a smaller, cheaper model for non-reasoning work, reducing running costs and speeding up the pipeline. I recently attended a classifier model workshop and would apply that technique here now"
          - "Built shareable demo environments with Nix flakes to show the impact to clients, who were very happy with the results; the team received a HD"
      - name: Full-Stack Elixir D&D Game API (Personal Project)
        date:
        start_date:
        end_date:
        location: Personal project [GitHub](https://github.com/Lachlan-Deck/T_TTRPG)
        summary: "Learning Elixir for fun. **Stack:** Elixir, Phoenix, React TS, GraphQL (Absinthe)."
        highlights:
          - "Wrote the dice endpoints in Elixir, then built both a React frontend and a Phoenix LiveView (websocket) frontend over the same GraphQL API"
          - "Work is trunk-based, with PR templates and squash merges into main. Implementing an event-driven Entity Component System so features such as buffs can listen for relevant rolls, plus a parser for Roll20's /roll syntax"
      - name: Music Library AWS CRUD App (Cloud Computing Project)
        date:
        start_date:
        end_date:
        location: RMIT Team of 3 [GitHub](https://github.com/Lachlan-Deck/RMIT_music_library_cloud_project)
        summary: "**Stack:** EC2, S3, Fargate, Lambda, API Gateway, Terraform, Ansible, DNS, DynamoDB."
        highlights:
          - "Delivered the EC2 backend and the deployment pipeline for all 3 backends (EC2, ECS, Lambda), using Ansible to install software, bootstrap an Nginx reverse proxy and issue an HTTPS cert with Certbot and Let's Encrypt"
          - "Built the music-browsing frontend (filters, login/logout) and a pipeline step that syncs the static site to S3 with per-user bucket names, so the whole team could deploy at once with no conflicts; received a High Distinction"
      - name: Room Booking System on Raspberry Pis (IoT Project)
        date:
        start_date:
        end_date:
        location: RMIT Team of 4 [GitHub](https://github.com/Lachlan-Deck/RMIT_IOT_project)
        summary: "Booking system for study spaces, split across 3 applications. **Stack:** Python, Flask, Postgres, MQTT, Nix Flakes, Raspberry Pis."
        highlights:
          - "Set up the team's testing, deployment and development environments with Nix flakes, reproducible locally and on a Pi"
          - "Built the booking flow end to end over MQTT (wrote the listeners) and the Postgres master database, using a trigger to manage booking updates across tables; received a high grade"
    skills:
      - label: Languages
        details: Python, SQL, TypeScript, JavaScript, Elixir, HTML, CSS
      - label: AI & Automation
        details: AWS Bedrock, LangChain, Pydantic, Playwright
      - label: Practices
        details: Git, trunk-based development, pull requests, GitHub Actions, testing harnesses
      - label: Cloud & Infra
        details: AWS (EC2, S3, Fargate, Lambda, API Gateway), Terraform, Ansible, Docker, Nix Flakes, Nginx, Linux
      - label: Frameworks & Data
        details: React, NodeJS, Phoenix, Flask, GraphQL, Postgres, MQTT
    volunteering:
      - name: Student Mentor @RMIT
        date:
        start_date:
        end_date:
        location:
        summary:
        highlights:
          - "Selected for the mentor program on strong academic performance; answered coursework questions and mentored students in web development"
          - "Triaged student issues and fostered a non-judgmental space to work through challenges"
design:
  theme: engineeringresumes
  page:
    size: a4
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.55in
    right_margin: 0.55in
    show_footer: false
    show_top_note: false
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 79, 144)
    headline: rgb(0, 79, 144)
    connections: rgb(0, 79, 144)
    section_titles: rgb(0, 79, 144)
    links: rgb(0, 79, 144)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.5em
    font_size:
      body: 9.5pt
      name: 24pt
      connections: 9pt
      section_titles: 1.15em
  header:
    space_below_name: 0.3cm
    space_below_connections: 0.2cm
    connections:
      separator: '|'
      show_icons: false
      display_urls_instead_of_usernames: true
  section_titles:
    type: with_full_line
    space_above: 0.3cm
    space_below: 0.15cm
  sections:
    space_between_regular_entries: 0.28cm
    space_between_text_based_entries: 0.1cm
  entries:
    summary:
      space_above: 0.05cm
    highlights:
      space_above: 0.05cm
      space_between_items: 0.03cm
locale:
  language: english
settings:
  current_date: today
  render_command:
    output_folder: rendercv_output
    design:
    locale:
    typst_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.typ
    pdf_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.pdf
    markdown_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.md
    html_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.html
    png_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.png
    dont_generate_markdown: false
    dont_generate_html: false
    dont_generate_typst: false
    dont_generate_pdf: false
    dont_generate_png: false
  bold_keywords: []
  pdf_title: NAME - CV
