  custom_connections:
  sections:
    summary:
      - "Software engineering student (RMIT) with hands-on **Python** and **AI** experience, including an LLM pipeline built for a real client. I enjoy turning messy requirements into working solutions, explaining the results clearly, and growing my business analyst skills."
    education:
      - institution: RMIT University
        area: Enterprise Software Development
        degree: Bachelor of Information Technology
        date:
        start_date: 2022
        end_date: 2026-07
        location: Melbourne
        summary:
        highlights:
    skills:
      - label: Languages
        details: Python, TypeScript, JavaScript, Elixir, SQL, HTML, CSS
      - label: AI & Data
        details: AWS Bedrock, LangChain, Pydantic, Playwright, Postgres, GraphQL
      - label: Cloud & Infra
        details: AWS (EC2, S3, Fargate, Lambda, API Gateway), Terraform, Ansible, GitHub Actions, Docker, Nix Flakes, Nginx, Linux
      - label: Frameworks
        details: React, Flask, Phoenix, NodeJS, MQTT
    projects:
      - name: Final-Year Industry Project (AI)
        date:
        start_date:
        end_date:
        location: RMIT, Team of 4
        summary: "Client project: an internal tool for the RMIT course QA team that scrapes unformatted, changing web pages into structured Excel documents using LLMs. **Stack:** Python, AWS Bedrock, LangChain, Pydantic, Playwright, EC2, S3, Docker."
        highlights:
          - Redesigned the scraping architecture with Playwright, cutting LLM input tokens by ~66%. Outputs were type-safe (Pydantic, LangChain) and the pipeline was testable separately.
          - Added a two-pass approach with a smaller, cheaper model for non-reasoning work, reducing running costs and speeding up the pipeline. Recently attended a classifier model workshop and would apply that approach here today.
          - Built shareable demo environments with Nix flakes to show impact to the clients, who were very happy with the results. Team received a HD.
      - name: IoT Project
        date:
        start_date:
        end_date:
        location: RMIT, Team of 4
        summary: "Room booking system for study spaces, split across 3 applications. **Stack:** Python, Flask, Postgres, MQTT, Raspberry Pis, Nix Flakes. [GitHub](https://github.com/Lachlan-Deck/RMIT_IOT_project)"
        highlights:
          - Built the booking flow end to end over MQTT (wrote the listeners) and the Postgres master database, using a trigger to manage booking updates across tables.
          - Set up the team's testing, deployment and development environments with Nix flakes, reproducible locally and on a Pi. Received a high grade.
      - name: D&D Game Engine API
        date:
        start_date:
        end_date:
        location: Personal project
        summary: "Learning Elixir for fun. **Stack:** Elixir, Phoenix, React TS, GraphQL (Absinthe). [GitHub](https://github.com/Lachlan-Deck/T_TTRPG)"
        highlights:
          - Wrote the dice endpoints in Elixir, then built both a React frontend and a Phoenix LiveView (websocket) frontend over the same GraphQL API. Work in Git trunk with templated PRs, squash merged into main.
          - Implementing an event-driven Entity Component System and a parser for Roll20's /roll syntax, extended so characters can target others with damage, healing and buffs.
      - name: Cloud Computing Project
        date:
        start_date:
        end_date:
        location: RMIT, Team of 3
        summary: "**Stack:** EC2, S3, Fargate, Lambda, API Gateway, Terraform, Ansible, DNS. [GitHub](https://github.com/Lachlan-Deck/RMIT_music_library_cloud_project)"
        highlights:
          - Delivered the EC2 backend and the deployment pipeline for all 3 backends (EC2, ECS, Lambda), with an Nginx HTTPS reverse proxy via Certbot and Let's Encrypt, plus the music-browsing frontend. Received a High Distinction.
    volunteering:
      - name: Student Mentor, Vygo / RMIT
        date:
        start_date:
        end_date:
        location:
        summary:
        highlights:
          - Selected for the mentor program on strong academic performance; answered coursework questions and mentored students in web development, triaging issues in a non-judgmental, supportive space.
    about_me:
      - "I want to learn as much as I can about software engineering, CI/CD and infra, ask good questions, and respect the time of those mentoring me. I enjoy learning how other people approach problems. Since I was 17 I've played Dungeons & Dragons with adults in the industry, which taught me how to navigate social challenges and apologise for mistakes."
design:
  theme: engineeringresumes
  page:
    size: a4
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.55in
    right_margin: 0.55in
    show_footer: false
    show_top_note: false
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 79, 144)
    headline: rgb(0, 79, 144)
    connections: rgb(0, 79, 144)
    section_titles: rgb(0, 79, 144)
    links: rgb(0, 79, 144)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.5em
    font_size:
      body: 9.5pt
      name: 24pt
      connections: 9pt
      section_titles: 1.15em
  header:
    space_below_name: 0.3cm
    space_below_connections: 0.2cm
    connections:
      separator: '|'
      show_icons: false
      display_urls_instead_of_usernames: true
  section_titles:
    type: with_full_line
    space_above: 0.3cm
    space_below: 0.15cm
  sections:
    space_between_regular_entries: 0.28cm
    space_between_text_based_entries: 0.1cm
  entries:
    summary:
      space_above: 0.05cm
    highlights:
      space_above: 0.05cm
      space_between_items: 0.03cm
