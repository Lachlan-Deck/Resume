    summary:
      - "Recent IT graduate (RMIT, July 2026) who likes building practical, automated solutions and solving cool problems. I built an LLM data-extraction pipeline for a real client, multiple API-driven apps, automated deployment pipelines, and I'm keen to learn fast alongside an AI and innovation team."
    skills:
      - label: AI & Automation
        details: "AWS Bedrock, LangChain, Pydantic (structured LLM output), Playwright, GitHub Actions, Ansible, Terraform"
      - label: Languages
        details: "Python, TypeScript, JavaScript, Elixir, SQL, HTML, CSS"
      - label: Frameworks & Data
        details: "React, NodeJS, Phoenix, Flask, GraphQL, Postgres, MQTT"
      - label: Cloud & Infra
        details: "AWS (EC2, S3, Fargate, Lambda, API Gateway), Docker, Nix Flakes, Nginx, Linux"
    projects:
      - name: Final-Year Industry Project
        date:
        start_date:
        end_date:
        location: RMIT, Team of 4
        summary: "Internal tool for the RMIT course QA team that scrapes unformatted, changing web pages into structured Excel documents. **Stack:** Python, Playwright, Bedrock, LangChain, Pydantic, EC2, S3, Docker."
        highlights:
          - "Redesigned the scraping architecture around Playwright so LLM calls needed far fewer tokens, cutting input tokens by ~66%, with type-safe outputs (Pydantic, LangChain) and a pipeline that could be tested separately."
          - "Added a two-pass approach using a smaller, cheaper model for non-reasoning work, reducing running costs and speeding up the pipeline. Having since attended a classifier model workshop, I'd apply that here next."
          - "Built shareable demo environments with Nix flakes to show impact to the clients, who were very happy with the results; the team received a HD."
      - name: D&D Game Engine API
        date:
        start_date:
        end_date:
        location: Personal project, [GitHub](https://github.com/Lachlan-Deck/T_TTRPG)
        summary: "Learning Elixir for fun. **Stack:** Elixir, Phoenix, React TS, GraphQL (Absinthe)."
        highlights:
          - "Wrote the dice endpoints in Elixir, then built both a React frontend and a Phoenix LiveView (websocket) frontend over the same GraphQL API. Work follows trunk-based Git with PR templates and squash merges."
          - "Implementing an event-driven Entity Component System so features such as buffs can listen for relevant rolls, plus a parser for Roll20's /roll syntax extended to let characters target others with damage and healing."
      - name: Cloud Computing Project
        date:
        start_date:
        end_date:
        location: RMIT, Team of 3, [GitHub](https://github.com/Lachlan-Deck/RMIT_music_library_cloud_project)
        summary: "**Stack:** EC2, S3, Fargate, Lambda, API Gateway, Terraform, Ansible, DNS."
        highlights:
          - "Delivered the EC2 backend and an automated deployment pipeline for all 3 backends (EC2, ECS, Lambda), using Ansible to install software, bootstrap an Nginx reverse proxy and issue an HTTPS cert with Certbot and Let's Encrypt."
          - "Built the frontend and a pipeline step that syncs the static site to S3 with per-user bucket names, so the whole team could deploy at once with no conflicts. Received a High Distinction."
      - name: IoT Project
        date:
        start_date:
        end_date:
        location: RMIT, Team of 4, [GitHub](https://github.com/Lachlan-Deck/RMIT_IOT_project)
        summary: "Room booking system split across 3 applications. **Stack:** Raspberry Pis, Python, Flask, Postgres, MQTT, Nix Flakes."
        highlights:
          - "Integrated the 3 applications over MQTT (wrote the listeners) and built the Postgres master database, using a trigger to manage booking updates across tables."
          - "Set up the team's testing, deployment and development environments with Nix flakes, reproducible locally and on a Pi. Received a high grade."
      - name: Home Lab
        date:
        start_date:
        end_date:
        location: Personal project
        summary:
        highlights:
          - "Deploy Docker images on a Synology NAS using Container Manager to self-host web apps."
